[project]
name = "medicore"
version = "0.1.0"
description = "AI-powered supplier catalog ingestion, ranking, and chat system"
requires-python = ">=3.12,<3.14"
dependencies = [
    "celery>=5.4.0",
    "fastapi>=0.115.0",
    "google-api-python-client>=2.149.0",
    "google-auth>=2.35.0",
    "httpx>=0.27.0",
    "markitdown>=0.1.2",
    "pdfplumber>=0.11.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.5.0",
    "pymupdf>=1.24.10",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.9",
    "redis>=5.0.8",
    "sqlalchemy>=2.0.35",
    "supabase>=2.8.0",
    "uvicorn[standard]==0.30.6",
    "pandas",
    "openpyxl",
    "xlrd",
    "mammoth",
    "pydantic[email]",
    "email-validator>=2.2.0",
    "python-dotenv>=1.2.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.8",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
